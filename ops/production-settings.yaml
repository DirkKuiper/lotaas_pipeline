# Channels masked in every beam regardless of the RFI statistics, by index
# into the filterbank's own channel ordering. Empty is allowed.
bad_channels:
  - 138
rfi_block_size: 1000
rfi_averaging_factor: 128
persistent_channel_threshold: 4.0
# Before dedispersion (lotaas_reprocessing.preprocess): masked cells at their channel's own local
# level, not the global mean, which left 7.9 s steps in the dedispersed series; and a zero-DM filter
# against broadband interference and the tied-array beam's broadband wander.
preprocessing:
  mask_fill: local
  zero_dm: true
single_pulse:
  max_width_seconds: 1.0
  # A running baseline of 2 s, doubled until it spans 64 widths, under each boxcar. With the
  # preprocessing above, injected pulses of white-noise S/N 30 came out at 26-28 and were found in
  # 94-96 of 96 trials; the search before found 0-7 (benchmarks/snr-discrepancy-2026-09-27).
  baseline_seconds: 2.0
  # ... doubled only until it spans 8 widths, not 64. At high DM the zero-DM filter no longer cancels
  # slow per-channel variations (the sweep lasts 30-260 s) and a 64-width window left them under every
  # wide boxcar: FRB-like bursts injected at DM 300-2500 came out at a median 0.54 of their ideal S/N,
  # with 8 widths 0.82; pulsar pulses unchanged (benchmarks/frb-injection-2026-09-28, 28 September).
  baseline_widths: 8
  # One crossing per event per trial (strongest width and sample) instead of
  # one per sample and width: identical clusters, 40-180x fewer rows, and RFI
  # beams no longer stop at the 25 million-crossing guard.
  merge_events: true
dedispersion_plan:
  - low_dm: 0.000
    high_dm: 150.600
    ddm: 0.10
    downsample: 1
  - low_dm: 150.600
    high_dm: 289.800
    ddm: 0.30
    downsample: 2
  - low_dm: 289.800
    high_dm: 511.800
    ddm: 0.50
    downsample: 4
  - low_dm: 511.800
    high_dm: 1010.800
    ddm: 1.00
    downsample: 8
  - low_dm: 1010.800
    high_dm: 2014.800
    ddm: 2.00
    downsample: 16
  - low_dm: 2014.800
    high_dm: 3020.000
    ddm: 5.00
    downsample: 32
periodicity:
  enabled: true
  period_min_seconds: 0.016
  period_max_seconds: 300.0
  harmonics: [1, 2, 4, 8, 16]
  threshold: 12.0  # nominal -log10 Gamma tail; not Gaussian sigma
  red_noise_window_bins: 257
  rfi_frequencies_hz: [1.0, 50.0, 60.0]
  rfi_tolerance_bins: 2
  sift_dm_tolerance: 2.0
  sift_period_fraction: 0.001
  # Retention, not coverage: every template is searched. A crowded trial keeps
  # its strongest distinct peaks and a crowded beam sifts its strongest; the
  # numbers dropped are recorded in the coverage report and summary.
  max_candidates_per_trial: 100
  max_candidates_per_beam: 20000
  max_sift_comparisons: 200000000
  max_folds: 16
  fold_bins: 64
  fold_subintegrations: 32
  catalogue_match: true
  # Zero-pad each trial to a 7-smooth FFT length instead of letting prime-factor
  # lengths fall back to a several-times slower FFT. No samples are dropped.
  fft_fast_lengths: true
  # Periodicity uses a dedicated grid.  The transient plan becomes too coarse
  # at high DM for narrow pulses once its downsampling is included.
  # It stops at DM 1000. At 135 MHz the median scatter broadening (Bhat et al.
  # 2004) is ~0.8 s at DM 200, ~7 s at DM 300 and minutes by DM 500, and ATNF
  # lists no LOTAAS detection above DM 217. Under the uncapped grid 735 of the
  # 814 unflagged folds of the first 371 beams of 23 September lay above DM 1000,
  # and they alone made 80 beams keep their 1.2 GB filterbank.
  dm_plan:
    - {low_dm: 0.000, high_dm: 150.600, ddm: 0.10, downsample: 1}
    - {low_dm: 150.600, high_dm: 300.000, ddm: 0.20, downsample: 2}
    - {low_dm: 300.000, high_dm: 600.000, ddm: 0.40, downsample: 4}
    - {low_dm: 600.000, high_dm: 1000.000, ddm: 0.50, downsample: 8}
  # A period found in several beams of one observation is RFI: a pulsar lies
  # in one beam or a few neighbours, at one DM. Sifted peaks of a batch are
  # compared across beams before folding, so RFI cannot take the fold slots.
  multibeam_veto: true
  veto_bins: 1.1
  veto_beams: 4

# Single-pulse review: one-second templates, local noise check, then FETCH.
classification:
  # B0950+08 (DM 2.97) and 17 other LOTAAS pulsars sit below DM 10; from DM 2
  # they are recorded as redetections, the pipeline's own sensitivity check.
  min_dm: 2.0
  # With the local mask fill, zero-DM filter and 2 s baseline (27 September 2026) the noise
  # scale is the true one, and S/N 7 is where interference residue crowds the queue: the first
  # night gave ~60 FETCH positives a SAP, 54% of those left for review below S/N 8 (user's
  # choice, 28 September, as for the early-cycle beams).
  min_snr: 8.0
  max_width_seconds: 1.0
  min_local_snr: 5.0
  # No FETCH for a cluster whose S/N on its own data, measured as the search measures (the review
  # page's local S/N, own_data), is below both 4 and half its search S/N: 78% of what FETCH
  # rejected, none of 444 pulsar pulses or 51 injected ones (28 September 2026).
  min_own_snr: 4.0
  min_own_fraction: 0.5
  # FETCH accepts almost no burst wider than 150 ms, the width most FRBs have at 135 MHz: at DM >= 100
  # it is not asked about anything wider than 0.15 s, nor about clusters between S/N 7 and 8. What it
  # rejects, or was not asked about, that its own data show (own S/N) and that fades when dedispersed
  # at 0.5 and 0.75 x its DM (dispersion ratio) is kept as 'dispersed' and queued, with cuts by width
  # and stricter ones below S/N 8. Through the whole chain, 558 of 803 FRB-like bursts injected into a
  # real SAP reached the queue (29% before 28 September), with 5 real clusters of the SAP
  # (benchmarks/frb-injection-2026-09-28).
  # FETCH's bowtie DM-time span (fetch_bowtie) and cleaned chunk (fetch_clean: scaled per channel, the search's RFI
  # mask, zero-DM) are off below DM 100. With both on at every DM, one model enough and FETCH asked about every
  # width (release 7981e0a, 30 September to 2 October 2026), FETCH passed 3.33 candidates a beam where it had passed
  # 0.44: 49,111 positives in 14,906 beams, 40,099 of them wider than 0.15 s and 42,268 below DM 100, where a wide
  # broadband burst cannot be told from DM 0; 46 candidates a SAP were left open where there had been about none.
  #
  # From DM 100 FETCH is asked about every width on that input, and its verdict stands with five of its six models
  # and the candidate's own data behind it: fading when dedispersed too little (ratio), a spectrum smooth across the
  # band, not at the beam's edges. What it does not accept goes to the dispersed route below, as before. Of the 634
  # injected bursts FETCH judged in the levelled chain test, 608 pass that rule and 626 with the route (613 by the
  # route alone; 629 with four models). Of release 7981e0a's positives from DM 100 that were still open, 0.24 a SAP
  # pass it and 0.48 with the route (0.93 with four models, 13.7 with one). Through the whole chain 648 of 803
  # injected bursts stay open instead of 640, with one real cluster more than 5 s from a burst in both, at 182 s a
  # beam instead of 145 (benchmarks/fetch-flood-2026-10-02; fetch-bowtie-2026-09-30 LI).
  fetch_high_dm:
    min_dm: 100.0
    bowtie: 0.5
    clean: {rfi_mask: true}
    min_votes: 5
    max_ratio: 0.8
    min_smoothness: 0.6
    edge_seconds: 20.0
  dispersed:
    min_dm: 100.0
    min_snr: 7.0
    faint: {min_own_snr: 7.0, max_ratio: 0.5}
    fetch_max_width_seconds: 0.15
    # A burst's on-pulse spectrum is smooth over many channels; the first night's candidates were mostly
    # channels jumping in level for seconds (own_data.smoothness: 1 of 428 injected bursts below 0.6, 112 of
    # 159 of the night's candidates), and events in the first and last seconds of the beam.
    min_smoothness: 0.6
    edge_seconds: 20.0
    tiers:
      - {max_width_seconds: 0.13, min_own_snr: 5.0, max_ratio: 0.8}
      - {max_width_seconds: 0.26, min_own_snr: 8.0, max_ratio: 0.6}
      - {max_width_seconds: 0.5, min_own_snr: 8.0, max_ratio: 0.5}
      - {max_width_seconds: 1.0, min_own_snr: 10.0, max_ratio: 0.4}
  # Bounds FETCH time on an RFI-rich beam; the rest are kept as 'unclassified'.
  max_fetch_candidates: 200
