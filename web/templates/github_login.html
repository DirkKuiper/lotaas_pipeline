<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · LOTAAS</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main style="max-width: 640px; padding-top: 12vh">
  <div class="card">
    <p class="muted small">AstroFlash · LOTAAS</p>
    <h1>Campaign dashboard</h1>
    <p>Sign in with your GitHub account to continue. Access is available to members of {{ organization }}.</p>
    {% if message %}<p role="alert">{{ message }}</p>{% endif %}
    <p><a class="button" href="{{ login_url }}">Sign in with GitHub →</a></p>
    <p class="small muted"><a href="https://astroflash-frb.github.io/">Back to AstroFlash</a></p>
  </div>
</main>
</body>
</html>
